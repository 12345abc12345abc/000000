<helmet>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IEG NEWS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 디자인 시스템: Update/0.txt (Apple 웹 디자인 언어)를 따른다.
     흰 면 / 연회색(parchment) 면 / 짙은 면을 번갈아 쓰고, 배경 장식(무늬·입자·질감)은 없다.
     색은 IEG 브랜드 세 가지를 조화로운 포인트로 쓴다:
       #333333 글자와 짙은 면, #FF0000 주 포인트(누르는 것·현재), #FFB300 보조 포인트(막대·점·hover 면).
     그림자는 사진(소식지 지면)에만 하나 쓴다. */
  :root {
    --ink: #333333;          /* 모든 글자, 짙은 면 (브랜드 무채색) */
    --ink-80: #333333;       /* 약간 부드러운 글자 */
    --muted: #6e6e73;        /* 보조 글자 */
    --muted-48: #86868b;     /* 작은 안내 글자 */
    --red: #FF0000;          /* 주 포인트 (브랜드 대표색) */
    --amber: #FFB300;        /* 보조 포인트 (브랜드 보조색) */
    --amber-soft: rgba(255,179,0,0.10); /* 보조 포인트를 옅게 깐 면 */
    /* 브랜드 띠: 무채색 · 빨강 · 노랑을 끊어서 잇는다 */
    --brand-band: linear-gradient(90deg, #333333 0 72%, #FF0000 72% 90%, #FFB300 90% 100%);
    --canvas: #FFFFFF;       /* 흰 면 */
    --parch: #F5F5F7;        /* 연회색 면 */
    --hair: rgba(0,0,0,0.08);/* 머리카락 선 */
    --chip: rgba(210,210,215,0.64); /* 사진 위 원형 버튼 */
    --shadow-photo: 3px 5px 30px rgba(0,0,0,0.22); /* 시스템의 유일한 그림자: 사진 전용 */
    --ease: cubic-bezier(.2,.8,.2,1);
    --nav-h: 52px;
    --font-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  html {
    margin: 0; padding: 0; scroll-behavior: smooth;
    scrollbar-gutter: stable; overflow-y: scroll;
    background: var(--canvas);
  }
  body {
    margin: 0; padding: 0; background: var(--canvas);
    font-family: var(--font-text); font-size: 17px; line-height: 1.47; letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased; color: var(--ink);
  }
  * { font-family: inherit; }
  a { color: var(--ink); text-decoration: none; }
  ::selection { background: rgba(255,179,0,0.38); color: var(--ink); }
  :focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
  button { font: inherit; }

  /* ── 움직임: 화면이 처음 뜰 때는 아무것도 움직이지 않는다 ── */
  @keyframes iegIn   { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes iegFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes iegRise { from { opacity: 0; translate: 0 20px; } to { opacity: 1; translate: 0 0; } }
  @keyframes iegZoom { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: none; } }
  /* 스크롤해서 새로 들어오는 항목만 들어오는 만큼 떠오른다 (지원 브라우저) */
  @supports (animation-timeline: view()) {
    .ieg-row, .ieg-sheet {
      animation: iegRise linear both;
      animation-timeline: view();
      animation-range: cover 0% cover 18%;
    }
  }

  /* ── 뼈대 ── */
  /* 본문 래퍼. 게이지는 이 상자의 높이 변화를 보고 위치를 다시 잰다. */
  .ieg-wrap { position: relative; min-height: 100vh; }
  /* 안쪽 칼럼: 글이 많은 화면의 Apple 폭(980px) */
  .ieg-in { box-sizing: border-box; max-width: 1024px; margin: 0 auto; padding: 0 22px; }

  /* 머리말: 제호와 회사명 */
  .ieg-head { background: var(--canvas); }
  /* 맨 위 브랜드 띠 */
  .ieg-head::before { content: ""; display: block; height: 4px; background: var(--brand-band); }
  .ieg-head .ieg-in {
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px;
    padding-top: clamp(28px, 4vw, 48px); padding-bottom: clamp(14px, 1.6vw, 20px);
  }
  .ieg-mark {
    margin: 0; font-family: var(--font-display);
    font-size: clamp(32px, 4.2vw, 48px); font-weight: 600; line-height: 1.07; letter-spacing: -0.03em;
  }
  .ieg-mark span, .ieg-nav-mark span { color: var(--red); }
  .ieg-co { margin: 0 0 6px; font-size: 12px; line-height: 1; letter-spacing: -0.01em; color: var(--muted); }

  /* 위에 붙는 구역 메뉴: 붙었을 때만 반투명 막이 생기고 작은 제호가 나타난다 */
  .ieg-nav {
    position: sticky; top: 0; z-index: 30;
    border-bottom: 1px solid var(--hair);
    transition: background .3s var(--ease);
  }
  .ieg-nav.is-stuck {
    background: rgba(245,245,247,0.8);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
  }
  .ieg-nav .ieg-in { display: flex; align-items: center; justify-content: space-between; height: var(--nav-h); }
  .ieg-nav-mark {
    font-family: var(--font-display); font-size: 17px; font-weight: 600; letter-spacing: -0.02em;
    opacity: 0; transition: opacity .3s var(--ease);
  }
  .ieg-nav.is-stuck .ieg-nav-mark { opacity: 1; }
  /* 두 구역 바로가기는 항상 같은 크기 */
  .ieg-links { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; width: min(220px, 60vw); }
  .ieg-link {
    display: flex; align-items: center; justify-content: center; height: 32px; border-radius: 999px;
    font-size: 14px; letter-spacing: -0.016em; color: var(--ink);
    transition: background .2s var(--ease), color .2s var(--ease), transform .12s var(--ease);
  }
  .ieg-link:hover { background: rgba(0,0,0,0.05); color: var(--red); }
  .ieg-link:active { transform: scale(0.95); }

  /* ── 구역(타일): 흰 면과 연회색 면이 번갈아 나오고, 색이 바뀌는 것 자체가 구분선이다 ── */
  .ieg-tile { padding: clamp(44px, 6.5vw, 80px) 0; scroll-margin-top: var(--nav-h); }
  .ieg-tile.is-parch { background: var(--parch); }
  .ieg-sec-head {
    display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px;
    margin-bottom: clamp(24px, 3.4vw, 40px);
  }
  /* 구역 제목 위의 짧은 막대: 빨강에서 노랑으로 끊어 잇는다 */
  .ieg-sec-head h2::before {
    content: ""; display: block; width: 28px; height: 4px; margin-bottom: 14px; border-radius: 2px;
    background: linear-gradient(90deg, var(--red) 0 60%, var(--amber) 60% 100%);
  }
  .ieg-sec-head h2 {
    margin: 0; font-family: var(--font-display);
    font-size: clamp(26px, 3vw, 34px); font-weight: 600; line-height: 1.12; letter-spacing: -0.025em;
  }
  /* 구역 제목 오른쪽 안내 문구 */
  .ieg-note {
    flex: 1 1 260px; margin: 0; text-align: right;
    font-size: 14px; line-height: 1.43; letter-spacing: -0.016em; color: var(--muted);
    text-wrap: balance; word-break: keep-all;
  }
  @media (max-width: 640px) { .ieg-note { text-align: left; } }

  /* 더보기: 강조색 테두리 알약 버튼. 누르면 살짝 줄어든다. */
  .ieg-more { display: flex; justify-content: center; margin-top: clamp(32px, 4vw, 48px); }
  .ieg-pill {
    box-sizing: border-box; min-width: 132px; height: 44px; padding: 0 26px;
    appearance: none; border: 1px solid var(--red); border-radius: 999px; background: transparent;
    font-size: 17px; line-height: 1; letter-spacing: -0.02em; color: var(--red); cursor: pointer;
    transition: background .2s var(--ease), color .2s var(--ease), transform .12s var(--ease);
  }
  .ieg-pill:hover { background: var(--red); color: #FFFFFF; }
  .ieg-pill:active { transform: scale(0.95); }

  /* ── 소식지: 호마다 지면을 사진처럼 올려 둔다 ── */
  .ieg-issue { max-width: 820px; margin: 0 auto; }
  .ieg-issue + .ieg-issue { margin-top: clamp(48px, 6vw, 72px); }
  .ieg-issue-label {
    margin: 0 0 14px; font-family: var(--font-display);
    font-size: 17px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: var(--ink);
    display: flex; align-items: center; gap: 8px;
  }
  /* 호 표시 앞의 노란 점 */
  .ieg-issue-label::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--amber); }
  .ieg-pages { display: flex; flex-direction: column; gap: clamp(20px, 2.6vw, 32px); }
  .ieg-sheet {
    display: block; width: 100%; padding: 0; border: 0; background: var(--canvas);
    box-shadow: var(--shadow-photo); cursor: zoom-in;
    transition: transform .4s var(--ease);
  }
  .ieg-sheet:hover { transform: translateY(-4px); }
  .ieg-sheet:active { transform: scale(0.99); }
  .ieg-sheet img { display: block; width: 100%; height: auto; }

  /* ── 언론 보도: 썸네일과 함께 한 줄씩 ── */
  .ieg-list { margin: 0; }
  .ieg-row {
    position: relative;
    display: flex; align-items: flex-start; gap: clamp(14px, 2vw, 22px);
    padding: clamp(14px, 1.8vw, 20px) 16px; margin: 0 -16px;
    border-radius: 18px;
    transition: background .25s var(--ease);
  }
  /* 줄 사이 머리카락 선. 커서를 올린 줄의 위아래 선은 감춘다. */
  .ieg-row + .ieg-row::before {
    content: ""; position: absolute; top: 0; left: 16px; right: 16px; height: 1px; background: var(--hair);
    transition: opacity .25s var(--ease);
  }
  .ieg-row:hover::before, .ieg-row:hover + .ieg-row::before { opacity: 0; }
  /* 커서를 올리면 항목 전체가 연회색 면으로 떠오르고 제목이 강조색이 된다 */
  .ieg-row:hover { background: var(--amber-soft); }
  .ieg-row:hover .ieg-title { color: var(--red); }
  .ieg-thumb {
    flex: 0 0 auto; display: block; overflow: hidden; border-radius: 8px; background: var(--parch);
    width: clamp(96px, 15vw, 168px); aspect-ratio: 16 / 10;
  }
  .ieg-thumb img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .5s var(--ease); }
  .ieg-row:hover .ieg-thumb img { transform: scale(1.05); }
  .ieg-meta {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-bottom: 6px;
    font-size: 14px; line-height: 1.29; letter-spacing: -0.016em; color: var(--muted);
  }
  .ieg-date { font-variant-numeric: tabular-nums; }
  .ieg-media { font-weight: 600; color: var(--red); }
  .ieg-tag { font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--hair); color: var(--muted); }
  .ieg-title {
    display: block; font-family: var(--font-display);
    font-size: clamp(17px, 1.7vw, 19px); font-weight: 600; line-height: 1.34; letter-spacing: -0.022em;
    text-wrap: pretty; transition: color .2s var(--ease);
  }

  /* ── 꼬리말 ── */
  /* 꼬리말: 짙은 면(#333333) 위에 브랜드 띠, 제호의 NEWS는 노랑 */
  .ieg-foot { background: var(--ink); }
  .ieg-foot::before { content: ""; display: block; height: 4px; background: var(--brand-band); }
  .ieg-foot-mark span { color: var(--amber); }
  .ieg-foot .ieg-in {
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px;
    padding-top: 22px; padding-bottom: 28px;
    font-size: 12px; line-height: 1.33; letter-spacing: -0.01em; color: rgba(255,255,255,0.72);
  }

  /* ── 오른쪽 날짜 게이지 (언론 보도의 연·월) ── */
  /* 게이지 상자는 점이 놓이는 30px 칸뿐이고, 글자는 그 왼쪽으로 삐져나온다. */
  .ieg-rail {
    position: fixed; z-index: 35;
    right: clamp(14px, 2vw, 30px); top: 50%; transform: translateY(-50%);
    width: 30px; max-height: 64vh;
  }
  .ieg-rail > i { position: absolute; display: block; }
  .ieg-rail-track { top: 0; bottom: 0; right: 14px; width: 2px; border-radius: 2px; background: #E5E5EA; }
  .ieg-rail-fill {
    position: absolute; top: 0; left: 0; right: 0; display: block; border-radius: 2px;
    background: linear-gradient(var(--red), var(--amber)); transition: height .3s var(--ease);
  }
  .ieg-rail-thumb {
    right: 10px; width: 10px; height: 10px; margin-top: -5px;
    border-radius: 50%; background: var(--red); box-shadow: 0 0 0 4px rgba(255,0,0,0.14);
    transition: top .3s var(--ease); pointer-events: none; z-index: 2;
  }
  .ieg-tick {
    position: absolute; right: 0; width: 30px; height: 18px; margin-top: -9px;
    padding: 0; appearance: none; border: 0; background: none; cursor: pointer; z-index: 1;
  }
  .ieg-tick .d {
    position: absolute; right: 12px; top: 50%; width: 6px; height: 6px; margin-top: -3px;
    border-radius: 50%; background: #C7C7CC;
    transition: transform .2s var(--ease), background .2s var(--ease);
  }
  .ieg-tick.is-year .d { width: 8px; height: 8px; margin-top: -4px; right: 11px; background: var(--ink); }
  .ieg-tick.is-page .d { background: var(--amber); }
  .ieg-tick:hover .d { background: var(--red); transform: scale(1.5); }
  .ieg-tick .lab {
    position: absolute; right: 30px; top: 50%; transform: translateY(-50%);
    display: flex; align-items: baseline; gap: 6px; padding: 2px 7px; border-radius: 999px; white-space: nowrap;
    background: rgba(255,255,255,0.9);
    font-size: 11px; font-weight: 600; letter-spacing: 0; font-variant-numeric: tabular-nums; color: var(--muted-48);
    transition: color .2s var(--ease), background .2s var(--ease), opacity .2s var(--ease);
  }
  .ieg-tick.is-bare .lab { display: none; }
  .ieg-tick .y { font-weight: 700; color: var(--ink); }
  .ieg-tick .y:empty, .ieg-tick .m:empty { display: none; }
  .ieg-tick.is-page .lab { color: var(--ink); }
  .ieg-tick:hover .lab, .ieg-tick:hover .y { color: var(--red); }
  .ieg-tick.is-cur .lab { background: var(--red); gap: 0; }
  .ieg-tick.is-cur .lab, .ieg-tick.is-cur .y { color: #FFFFFF; }
  @media (max-width: 1399px) {
    .ieg-tick .lab { opacity: 0; pointer-events: none; }
    .ieg-tick.is-cur .lab { opacity: 1; }
    .ieg-rail:hover .ieg-tick .lab { opacity: 1; pointer-events: auto; }
  }
  @media (max-width: 899px) {
    .ieg-rail { right: 2px; pointer-events: none; }
    .ieg-tick { pointer-events: none; }
    .ieg-tick .d, .ieg-tick.is-year .d { width: 3px; height: 3px; margin-top: -1.5px; right: 13.5px; }
    .ieg-rail-thumb { width: 8px; height: 8px; margin-top: -4px; right: 11px; box-shadow: none; }
    .ieg-tick.is-cur .lab { opacity: 0; transition: opacity .35s var(--ease); }
    .ieg-rail.is-active .ieg-tick.is-cur .lab { opacity: 1; }
  }

  /* ── 사진 위 원형 버튼 (맨 위로, 확대 보기 조작) ── */
  .ieg-circle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; cursor: pointer;
    background: var(--chip); color: var(--ink); font-size: 18px; line-height: 1;
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    transition: background .2s var(--ease), color .2s var(--ease), transform .12s var(--ease);
  }
  .ieg-circle:hover { background: var(--ink); color: #FFFFFF; }
  .ieg-circle:active { transform: scale(0.95); }
  .ieg-top { position: fixed; right: clamp(16px, 3vw, 32px); bottom: clamp(16px, 3vw, 32px); z-index: 30; animation: iegIn .2s ease-out; }

  /* ── 확대 보기 ── */
  .ieg-modal {
    position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
    padding: clamp(16px, 4vw, 48px); cursor: zoom-out; animation: iegFade .25s ease-out;
    background: rgba(0,0,0,0.86);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  }
  .ieg-modal .ieg-circle { position: absolute; background: rgba(210,210,215,0.24); color: #FFFFFF; }
  .ieg-modal .ieg-circle:hover { background: rgba(210,210,215,0.5); color: #FFFFFF; }
  .ieg-modal .is-prev { left: clamp(10px, 2vw, 26px); top: 50%; margin-top: -22px; }
  .ieg-modal .is-next { right: clamp(10px, 2vw, 26px); top: 50%; margin-top: -22px; }
  .ieg-modal .is-close { top: clamp(12px, 2.5vw, 28px); right: clamp(12px, 2.5vw, 28px); }
  .ieg-modal-label {
    position: absolute; bottom: clamp(12px, 2.5vw, 28px); left: 50%; transform: translateX(-50%);
    font-size: 12px; letter-spacing: 0; color: rgba(255,255,255,0.7); font-variant-numeric: tabular-nums;
  }
  .ieg-zoom { animation: iegZoom .45s var(--ease) both; }

  /* 움직임을 줄이도록 설정한 사람에게는 모든 움직임을 끈다 */
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .ieg-sheet:hover { transform: none; }
  }
</style>
</helmet>
<div class="ieg-wrap">

  <header class="ieg-head">
    <div class="ieg-in">
      <h1 class="ieg-mark">IEG<span> NEWS</span></h1>
      <p class="ieg-co">주식회사 아이지 · TECH-EDU</p>
    </div>
  </header>

  <!-- 위에 붙는 구역 메뉴. 두 구역으로 바로 간다. -->
  <nav class="{{ navClass }}" aria-label="구역">
    <div class="ieg-in">
      <span class="ieg-nav-mark" aria-hidden="true">IEG<span> NEWS</span></span>
      <div class="ieg-links">
        <a class="ieg-link" href="#newsletter">소식지</a>
        <a class="ieg-link" href="#press">언론 보도</a>
      </div>
    </div>
  </nav>

  <!-- 소식지: 최신 호만 보이고, 더보기를 누르면 지난 호가 아래로 이어진다 -->
  <section id="newsletter" class="ieg-tile is-parch">
    <div class="ieg-in">
      <div class="ieg-sec-head">
        <h2>소식지</h2>
        <p class="ieg-note">월간 주요 소식</p>
      </div>
      <sc-for list="{{ issues }}" as="g" hint-placeholder-count="1">
        <article class="ieg-issue">
          <p class="ieg-issue-label">{{ g.issue }}</p>
          <!-- 지면 한 장이 버튼 하나라, 누른 면이 그대로 확대 보기에 뜬다. -->
          <div class="ieg-pages">
            <sc-for list="{{ g.previews }}" as="p" hint-placeholder-count="1">
              <button class="ieg-sheet" onClick="{{ p.open }}" aria-label="{{ p.alt }}">
                <img src="{{ p.src }}" alt="" loading="lazy">
              </button>
            </sc-for>
          </div>
        </article>
      </sc-for>
      <sc-if value="{{ nlMore }}" hint-placeholder-val="{{ true }}">
        <div class="ieg-more"><button class="ieg-pill" onClick="{{ openNl }}">더보기</button></div>
      </sc-if>
    </div>
  </section>

</sc-if>

  { m:'전자신문', d:'2021-09-24', t:'아이지, 기술력 확보와 우수 혁신기업 선정 통해 메타버스 기업으로 도약', u:'https://www.etnews.com/20210924000137', img:'https://img.etnews.com/news/article/2021/09/24/article_24154119505342.jpg' },

  { m:'헬로티', d:'2020-03-03', t:'아이지, “조직 혁신 DNA 도출 및 내재화 정기 교육 실시”', u:'https://www.hellot.net/news/article.html?no=50819', img:'https://www.hellot.net/data/photos/image/thumbnail_1583218218.jpg' },
  { m:'월간로봇기술', d:'2020', t:'(주)아이지, 첨단기술 융합된 방역로봇 개발', u:'https://robotzine.co.kr/entry/252960' },

  { m:'매일경제', d:'2019-03-06', t:'교육훈련 장비업체 아이지 “스마트공장 교육훈련 장비, 우리가 으뜸”', u:'https://www.mk.co.kr/news/business/8714501', img:'https://pimg.mk.co.kr/meet/neds/2019/03/image_readtop_2019_133570_15518127013657232.jpg' },

  { m:'경기일보', d:'2018-11-26', t:'기술개발 올인…4차 산업혁명 꿈꾼다 ㈜아이지', u:'https://www.kyeonggi.com/article/201811261027232', img:'https://ypzxxdrj8709.edge.naverncp.com/data2/content/image/2018/11/26/.cache/512/201811260807681.jpg?v=20260918022913' },
  { m:'월간로봇기술', d:'2018-10-30', t:'(주)아이지, 스마트공장 전문 기업으로 거듭나다', u:'https://robotzine.co.kr/entry/241134' },
  { m:'매일경제', d:'2018-09-17', t:'스마트공장 실습실 구축, 삼성 등 대기업도 러브콜', u:'https://www.mk.co.kr/news/business/8480010' },

  { m:'월간로봇기술', d:'2017-04-26', t:'교육장비 분야의 新시장 여는 (주)아이지', u:'https://robotzine.co.kr/entry/215716' },
  { m:'KOTRA', d:'2017', t:'교육훈련 장비 분야 일류기업, 아이지', u:'https://www.k-neiss.org/kotra/success-case/187' },

  { m:'여기에뉴스', d:'2014-02-03', t:'인력양성의 첨병으로 나선 (주)아이지 “로봇기술 배우러 오셨어요?”', u:'https://yeogienews.com/entry/46364', img:'https://file.yeogie.com/img.news/20142/UAZ2I70I1L.png' }
];

// 소식지. 호(월)마다 블록 하나이고, 최신 호가 배열 앞(위)으로 온다.
// 한 호 안에서는 면 순서대로 두고, 한 번에 한 면씩 보여주며 화살표로 넘긴다.
const ISSUES = [
  { issue: '2026. 09', pages: [
    { src: 'uploads/3.png' }
  ] },
  { issue: '2026. 08', pages: [
    { src: 'uploads/1.png' },
    { src: 'uploads/2.png' }
  ] }
];

// 확대 보기는 호 구분 없이 전체 면을 차례로 넘긴다.
const FLAT = [];
ISSUES.forEach((g, gi) => g.pages.forEach((p, pi) => {
  FLAT.push({ src: p.src, issue: g.issue, gi: gi, pi: pi });
}));


// 언론 보도는 처음에 최근 기사 이만큼만 보이고, 더보기를 누르면 전부 이어서 보인다.
const PRESS_PREVIEW = 6;

const rankOf = (media) => { const i = RANK.indexOf(media); return i === -1 ? RANK.length : i; };

// 발행일 내림차순(최신이 위). 같은 날짜면 RANK 순(메이저 언론사 우선).
// d는 'YYYY-MM-DD'가 기본이고, 일/월이 확인되지 않으면 'YYYY-MM' 또는 'YYYY'로 적는다.
// 짧은 값은 긴 값의 접두사라 내림차순에서 해당 기간 맨 뒤로 간다.
const SORTED = [...ARTICLES].sort((a, b) =>
  a.d === b.d ? rankOf(a.m) - rankOf(b.m) : (a.d < b.d ? 1 : -1)
);

// '2026-09-07' -> '2026. 09. 07' / '2024-05' -> '2024. 05' / '2017' -> '2017'
const dateLabel = (d) => d.split('-').join('. ');

// 오른쪽 날짜 게이지의 눈금: 언론 보도 기사의 연·월 키('2026-09', 월 미상이면 '2020')를 최신순으로.
// 기사를 추가하면 눈금도 저절로 늘어난다.
const ymOf = (d) => d.slice(0, 7);                    // '2026-09-07' -> '2026-09'
const RAIL_KEYS = [...new Set(SORTED.map(a => ymOf(a.d)))];
// 위에 붙어 있는 구역 메뉴 높이. 눈금을 눌러 이동할 때 그 아래로 내려놓고,
// '지금 보고 있는 위치' 판정선도 그 바로 아래에 둔다. 두 기준이 같아야
// 이동한 직후 게이지가 정확히 그 연·월을 가리킨다.
const navHeight = () => {
  const nav = document.querySelector('.ieg-nav');
  return nav ? nav.offsetHeight : 72;
};
const JUMP_GAP = 16;   // 이동했을 때 탭 줄과 기사 사이 간격
const READ_GAP = 48;   // 판정선은 탭 줄 아래 이만큼 (JUMP_GAP보다 커야 이동한 기사가 현재로 잡힌다)

class Component extends DCLogic {
  state = {
    nlOpen: false,      // 소식지 지난 호까지 펼쳤는지
    pressOpen: false,   // 언론 보도 전체 목록을 펼쳤는지
    modalIndex: null, showTop: false, stuck: false,
    railCur: null, railPos: 0, railActive: false,
    brokenImg: {}   // 불러오지 못한 썸네일 주소. 그 기사는 썸네일 칸 없이 글만 보인다.
  };

  // 썸네일이 깨졌거나(매체가 사진을 막거나 지운 경우) 점 같은 빈 그림이 오면 그 칸을 뺀다
  dropImg(src) {
    if (src && !this.state.brokenImg[src]) {
      this.setState(s => ({ brokenImg: { ...s.brokenImg, [src]: true } }));
    }
  }

  componentDidMount() {
    this._onKey = (e) => {
      if (this.state.modalIndex !== null) {
        if (e.key === 'Escape') this.closeModal();
        if (e.key === 'ArrowRight') this.step(1);
        if (e.key === 'ArrowLeft') this.step(-1);
      }
    };
    // 스크롤은 한 프레임에 한 번만 처리하고, 바뀐 값이 있을 때만 다시 그린다
    this._onScroll = () => {
      if (this._sraf) return;
      this._sraf = requestAnimationFrame(() => {
        this._sraf = 0;
        const y = window.scrollY || document.documentElement.scrollTop || 0;
        // stuck: 구역 메뉴가 화면 위에 붙었는지(머리말 높이는 화면 폭마다 달라 실제 위치로 잰다)
        const nav = document.querySelector('.ieg-nav');
        const showTop = y > 380, stuck = nav ? nav.getBoundingClientRect().top <= 0.5 && y > 0 : y > 120;
        if (showTop !== this.state.showTop || stuck !== this.state.stuck) this.setState({ showTop, stuck });
        this.updateRail();
        // 휴대폰에서는 스크롤하는 동안만 현재 연·월을 띄운다
        if (!this.state.railActive) this.setState({ railActive: true });
        clearTimeout(this._railT);
        this._railT = setTimeout(() => this.setState({ railActive: false }), 1100);
      });
    };
    this._onResize = () => this.updateRail();
    // 휠·터치·키보드·마우스 누름은 사람이 직접 움직인다는 신호라 눈금으로 고른 달의 고정을 푼다.
    // 눈금 클릭은 mousedown 다음에 오므로 고정이 풀린 뒤 다시 걸린다.
    this._unpin = () => { this._pin = null; };
    this._unpinOn = ['wheel', 'touchstart', 'keydown', 'mousedown'];
    this._unpinOn.forEach(t => window.addEventListener(t, this._unpin, { passive: true }));
    // 썸네일이 깨지거나 점 같은 빈 그림이 오면 그 기사의 썸네일 칸을 뺀다(dropImg).
    // img의 load·error는 위로 올라오지 않으므로 window에서 capture로 받는다.
    // (템플릿에 onError를 쓰면 원본 HTML이 먼저 깔릴 때 브라우저 기본 속성으로 실행돼 오류가 난다.)
    this._onImg = (e) => {
      const im = e.target;
      if (!im || im.tagName !== 'IMG' || !im.closest('.ieg-thumb')) return;
      if (e.type === 'error' || im.naturalWidth < 40 || im.naturalHeight < 30) this.dropImg(im.getAttribute('src'));
    };
    window.addEventListener('error', this._onImg, true);
    window.addEventListener('load', this._onImg, true);
    this.scanThumbs();
    window.addEventListener('keydown', this._onKey);
    window.addEventListener('scroll', this._onScroll, { passive: true });
    window.addEventListener('resize', this._onResize, { passive: true });

    this._view = this.state.nlOpen + ':' + this.state.pressOpen;
    requestAnimationFrame(() => this.updateRail());
    // 지면 이미지가 늦게 내려오면 문서 길이가 바뀐다. 그 전에 잰 값(문서가 짧아 '맨 끝'으로 판정)이
    // 남지 않도록, 길이가 바뀔 때마다 게이지를 다시 맞춘다. body는 화면 높이로 고정돼 있어
    // 늘어나지 않으므로 실제로 길어지는 본문 래퍼를 지켜본다.
    const wrap = document.querySelector('.ieg-wrap');
    if (window.ResizeObserver && wrap) {
      this._ro = new ResizeObserver(() => this.updateRail());
      this._ro.observe(wrap);
    }
  }

  // 소식지나 언론 보도를 펼치면 화면에 있는 기사가 달라지므로 게이지를 다시 맞춘다
  componentDidUpdate() {
    this.scanThumbs();
    const view = this.state.nlOpen + ':' + this.state.pressOpen;
    if (view !== this._view) {
      this._view = view;
      requestAnimationFrame(() => this.updateRail());
    }
  }

  // 리스너(_onImg)가 놓친 그림도 같은 기준으로 본다. 아주 빨리 뜨는 그림(캐시, 작은 그림)은 React가
  // 화면에 붙이기 전에 로드가 끝나 window까지 이벤트가 오지 않는다. 그려질 때마다 썸네일 10개만 훑으므로 가볍다.
  // 아직 안 불러온 지연 로딩 그림은 complete가 false라 건너뛴다.
  scanThumbs() {
    document.querySelectorAll('.ieg-thumb img').forEach(im => {
      if (im.complete && (im.naturalWidth < 40 || im.naturalHeight < 30)) this.dropImg(im.getAttribute('src'));
    });
  }

  componentWillUnmount() {
    window.removeEventListener('keydown', this._onKey);
    window.removeEventListener('scroll', this._onScroll);
    window.removeEventListener('resize', this._onResize);
    this._unpinOn.forEach(t => window.removeEventListener(t, this._unpin));
    window.removeEventListener('error', this._onImg, true);
    window.removeEventListener('load', this._onImg, true);
    if (this._sraf) cancelAnimationFrame(this._sraf);
    if (this._ro) this._ro.disconnect();
    clearTimeout(this._railT);
  }

  // 지금 보고 있는 연·월과 게이지 위 위치(0~100%)를 계산한다.
  // 화면에 있는 각 연·월의 첫 요소 중 '읽는 선' 위로 올라온 마지막 것이 현재이고,
  // 다음 연·월 요소까지 얼마나 왔는지로 점을 눈금 사이에서 부드럽게 움직인다.
  updateRail() {
    const keys = RAIL_KEYS;
    if (keys.length < 2) return;
    const seen = new Set();
    const marks = [];
    document.querySelectorAll('.ieg-list [data-ym]').forEach(el => {
      const ym = el.getAttribute('data-ym');
      if (seen.has(ym)) return;
      seen.add(ym);
      marks.push({ ym, top: el.getBoundingClientRect().top });
    });
    if (!marks.length) return;

    const line = navHeight() + READ_GAP;
    let i = 0;
    marks.forEach((m, k) => { if (m.top <= line) i = k; });
    let f = 0;
    if (marks[i].top <= line && marks[i + 1]) {
      f = (line - marks[i].top) / Math.max(1, marks[i + 1].top - marks[i].top);
      f = Math.max(0, Math.min(1, f));
    }
    // 페이지 끝까지 내렸으면 화면의 마지막 연·월에 맞춘다.
    // 아직 내리지 않았을 때(이미지가 덜 내려와 문서가 화면보다 짧을 때 포함)는 맨 끝으로 보지 않는다.
    const h = document.documentElement;
    if (h.scrollTop > 0 && h.scrollTop + h.clientHeight >= h.scrollHeight - 2) { i = marks.length - 1; f = 0; }
    // 눈금을 눌러 이동했다면 그 연·월을 가리킨다. 페이지가 짧아 그 달이 판정선까지 못 올라오고
    // 위 '맨 끝' 판정에 걸리더라도, 사람이 고른 달이 우선이다. 직접 스크롤하면 풀린다(_unpin).
    if (this._pin) {
      const k = marks.findIndex(m => m.ym === this._pin);
      if (k >= 0) { i = k; f = 0; }
    }

    const a = keys.indexOf(marks[i].ym);
    const b = marks[i + 1] ? keys.indexOf(marks[i + 1].ym) : a;
    if (a < 0) return;
    const idx = a + ((b < 0 ? a : b) - a) * f;
    const pos = Math.round((idx / (keys.length - 1)) * 1000) / 10;
    const cur = marks[i].ym;
    if (cur !== this.state.railCur || pos !== this.state.railPos) this.setState({ railCur: cur, railPos: pos });
  }

  // 게이지의 눈금을 누르면 언론 보도에서 그 연·월의 첫 기사로 이동한다.
  // 그 달이 아직 접혀 있는 목록에 있으면 목록을 펼친 뒤, 다 그려지고 나서 이동한다.
  jumpTo(ym) {
    // 고른 연·월은 사람이 직접 스크롤하기 전까지 게이지에 그대로 둔다(updateRail 참고)
    this._pin = ym;
    const go = () => {
      const el = document.querySelector('.ieg-list [data-ym="' + ym + '"]');
      if (!el) return;
      const smooth = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      // 위에 붙어 있는 탭 줄에 가리지 않도록 그만큼 덜 내린다
      const top = el.getBoundingClientRect().top + window.scrollY - navHeight() - JUMP_GAP;
      window.scrollTo({ top: Math.max(0, top), behavior: smooth ? 'smooth' : 'auto' });
      // 즉시 이동한 경우 스크롤 이벤트를 기다리지 않고 바로 게이지를 맞춘다
      if (!smooth) this.updateRail();
    };
    const shown = SORTED.slice(0, PRESS_PREVIEW).some(a => ymOf(a.d) === ym);
    if (!this.state.pressOpen && !shown) {
      // 펼친 목록이 그려진 직후(setState 콜백) 바로 옮긴다. 다음 프레임을 기다리면
      // 프레임이 늦는 환경에서 목록만 펼쳐지고 스크롤이 안 되는 일이 생긴다.
      this.setState({ pressOpen: true }, go);
      return;
    }
    go();
  }

  closeModal() {
    this.setState({ modalIndex: null });
  }

  step(dir) {
    this.setState(s => ({ modalIndex: (s.modalIndex + dir + FLAT.length) % FLAT.length }));
  }

  renderVals() {
    const s = this.state;

    // 언론 보도: 처음엔 최근 기사 PRESS_PREVIEW건, 더보기를 누르면 전부
    const shown = s.pressOpen ? SORTED : SORTED.slice(0, PRESS_PREVIEW);

    // 오른쪽 날짜 게이지 눈금. 각 연도의 첫 달에만 연도를 쓰고, 지금 위치는 'YYYY. MM' 칩으로.
    // 지금 화면에 나와 있는 기사의 달은 점을 진하게 해서, 접혀 있는 시기와 구분되게 한다.
    const keys = RAIL_KEYS;
    // 눈금 하나에 22px. 너무 길면 CSS의 max-height(64vh)에서 멈추고 눈금 간격이 좁아진다.
    const railH = Math.max(110, Math.min(keys.length - 1, 30) * 22);
    const onPage = new Set(shown.map(a => ymOf(a.d)));
    let prevYear = '';
    const railTicks = keys.map((ym, k) => {
      const y = ym.slice(0, 4);
      const m = ym.slice(5, 7);
      const isYear = y !== prevYear;
      prevYear = y;
      const isCur = ym === s.railCur;
      const yText = isCur || isYear ? y : '';
      const mText = m ? (isCur ? '. ' + m : m) : '';
      return {
        top: keys.length > 1 ? (k / (keys.length - 1)) * 100 : 0,
        cls: 'ieg-tick' + (isYear ? ' is-year' : '') + (onPage.has(ym) ? ' is-page' : '') +
             (isCur ? ' is-cur' : '') + (!yText && !mText ? ' is-bare' : ''),
        y: yText,
        m: mText,
        aria: y + '년' + (m ? ' ' + Number(m) + '월' : '') + '로 이동',
        go: () => this.jumpTo(ym)
      };
    });

    // 소식지: 처음엔 최신 호 하나만, 더보기를 누르면 지난 호까지. 확대 보기는 펼침과 상관없이 전체 면을 넘긴다.
    const issues = (s.nlOpen ? ISSUES : ISSUES.slice(0, 1)).map((g, gi) => ({
      issue: g.issue,
      previews: g.pages.map((p, pi) => ({
        src: p.src,
        alt: g.issue + ' ' + (pi + 1) + '면 크게 보기',
        open: () => this.setState({ modalIndex: FLAT.findIndex(f => f.gi === gi && f.pi === pi) })
      }))
    }));

    return {
      issues,
      nlMore: !s.nlOpen && ISSUES.length > 1,
      openNl: () => this.setState({ nlOpen: true }),
      items: shown.map(a => ({
        ym: ymOf(a.d),
        date: dateLabel(a.d), media: a.m, title: a.t, url: a.u,
        note: a.note || '',
        img: a.img && !s.brokenImg[a.img] ? a.img : ''
      })),
      pressMore: !s.pressOpen && SORTED.length > PRESS_PREVIEW,
      openPress: () => this.setState({ pressOpen: true }),
      railShow: keys.length > 1,
      railClass: s.railActive ? 'ieg-rail is-active' : 'ieg-rail',
      railH,
      railPos: s.railPos,
      railTicks,
      navClass: s.stuck ? 'ieg-nav is-stuck' : 'ieg-nav',
      showTop: s.showTop,
      scrollTop: () => window.scrollTo({ top: 0, behavior: 'smooth' }),
      modalOpen: s.modalIndex !== null,
      pageLabel: s.modalIndex !== null
        ? FLAT[s.modalIndex].issue + ' · ' + (FLAT[s.modalIndex].pi + 1) + '면'
        : '',
      modalImage: s.modalIndex !== null
        ? React.createElement('img', {
            // 면을 넘길 때마다 새로 그려 등장 효과가 매번 나오게 한다
            key: s.modalIndex,
            className: 'ieg-zoom',
            src: FLAT[s.modalIndex].src,
            alt: 'IEG 소식지 ' + FLAT[s.modalIndex].issue + ' 확대 보기',
            style: { maxWidth: 'min(920px,88vw)', maxHeight: '88vh', width: 'auto', height: 'auto', objectFit: 'contain', background: '#FFFFFF', boxShadow: '3px 5px 30px rgba(0,0,0,0.22)' }
          })
        : null,
      prevPage: (e) => { e.stopPropagation(); this.step(-1); },
      nextPage: (e) => { e.stopPropagation(); this.step(1); },
      // 확대 보기에서 넘긴 면을 닫은 뒤에도 그대로 보여준다.
      closeModal: () => this.closeModal()
    };
  }
}
</script>
</body>
</html>
