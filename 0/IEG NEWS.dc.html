<x-dc>
<helmet>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IEG NEWS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --ink: #333333;        /* 무채색 본문 */
    --red: #FF0000;        /* 대표색 */
    --amber: #FFB300;      /* 보조색 */
    --paper: #FAF7F0;      /* 바탕 */
    --sheet: #FFFDF8;      /* 지면 */
    --line: rgba(51,51,51,0.2);
    --line-soft: rgba(51,51,51,0.12);
    --muted: rgba(51,51,51,0.55);
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  html, body { margin: 0; padding: 0; background: var(--paper); scroll-behavior: smooth; }
  body { font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; -webkit-font-smoothing: antialiased; color: var(--ink); }
  * { font-family: inherit; }
  a { color: var(--ink); text-decoration: none; }
  a:hover { color: var(--red); }
  ::selection { background: var(--amber); color: var(--ink); }
  :focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
  @keyframes iegIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* ── 소식지: 호 카드 그리드 ── */
  .ieg-issues {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: clamp(28px, 4vw, 52px) clamp(24px, 3.5vw, 44px);
  }
  .ieg-card { position: relative; display: flex; flex-direction: column; gap: 14px; }

  /* 미리보기 상자. 호마다 면 수가 달라도 크기는 항상 같다. */
  .ieg-fan {
    position: relative;
    aspect-ratio: 4 / 5;
    cursor: zoom-in;
    background: none;
    border: 0;
    padding: 0;
    width: 100%;
    display: block;
  }
  .ieg-pg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    background: var(--sheet);
    border: 1px solid rgba(51,51,51,0.22);
    transform-origin: 50% 100%;
    transition: transform .45s var(--ease), box-shadow .35s var(--ease);
    box-shadow: 0 2px 10px rgba(51,51,51,0.10);
  }
  /* 쌓인 상태 — 뒤로 갈수록 조금씩 밀리고 기운다 */
  .ieg-pg:nth-child(1) { z-index: 4; }
  .ieg-pg:nth-child(2) { z-index: 3; transform: translate(4%, 2%) rotate(2.5deg); }
  .ieg-pg:nth-child(3) { z-index: 2; transform: translate(8%, 4%) rotate(5deg); }
  .ieg-pg:nth-child(4) { z-index: 1; transform: translate(12%, 6%) rotate(7.5deg); }

  /* 펼친 상태 — 커서를 올리면 카드처럼 부챗살로 벌어진다 */
  .ieg-fan:hover .ieg-pg, .ieg-fan:focus-visible .ieg-pg { box-shadow: 0 14px 30px rgba(51,51,51,0.20); }
  .ieg-fan:hover .ieg-pg:nth-child(1), .ieg-fan:focus-visible .ieg-pg:nth-child(1) { transform: translate(-13%, -3%) rotate(-8deg); }
  .ieg-fan:hover .ieg-pg:nth-child(2), .ieg-fan:focus-visible .ieg-pg:nth-child(2) { transform: translate(9%, -5%) rotate(7deg); }
  .ieg-fan:hover .ieg-pg:nth-child(3), .ieg-fan:focus-visible .ieg-pg:nth-child(3) { transform: translate(26%, 0%) rotate(15deg); }
  .ieg-fan:hover .ieg-pg:nth-child(4), .ieg-fan:focus-visible .ieg-pg:nth-child(4) { transform: translate(40%, 6%) rotate(22deg); }
  /* 한 장짜리 호는 펼칠 게 없으니 살짝 떠오르기만 한다 */
  .ieg-fan.is-single:hover .ieg-pg, .ieg-fan.is-single:focus-visible .ieg-pg {
    transform: translateY(-6px); border-color: var(--red);
  }
  .ieg-card:hover { z-index: 5; }

  /* ── 언론 보도: 목록 행 ── */
  .ieg-row {
    display: flex; align-items: flex-start;
    gap: clamp(12px, 2vw, 20px);
    padding: clamp(16px, 2.2vw, 22px) clamp(8px, 1.2vw, 14px);
    margin: 0 clamp(-8px, -1.2vw, -14px);
    border-top: 1px solid var(--line);
    transition: background .18s var(--ease), border-color .18s var(--ease);
  }
  .ieg-row:hover { background: rgba(255,255,255,0.55); border-top-color: var(--red); }
  .ieg-thumb { flex: 0 0 auto; display: block; overflow: hidden; background: #EFE9DE; border: 1px solid var(--line-soft); }
  .ieg-thumb img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .35s var(--ease); }
  .ieg-row:hover .ieg-thumb img { transform: scale(1.06); }

  @media (prefers-reduced-motion: reduce) {
    html, body { scroll-behavior: auto; }
    .ieg-pg, .ieg-thumb img { transition: none; }
    .ieg-fan:hover .ieg-pg:nth-child(1), .ieg-fan:hover .ieg-pg:nth-child(2),
    .ieg-fan:hover .ieg-pg:nth-child(3), .ieg-fan:hover .ieg-pg:nth-child(4) { transform: none; }
  }
</style>
</helmet>
<div style="min-height:100vh;background:#FAF7F0;padding:0 clamp(20px,5vw,64px) 0">
  <div style="position:fixed;top:0;left:0;right:0;height:3px;background:rgba(51,51,51,0.08);z-index:40">
    <div style="height:100%;background:#FF0000;width:{{ progress }}%"></div>
  </div>
  <div style="max-width:1160px;margin:0 auto">

    <header style="padding:clamp(28px,4vw,48px) 0 0">
      <div style="border-top:7px solid var(--ink)"></div>
      <div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;padding:clamp(20px,3vw,32px) 0">
        <h1 style="margin:0;font-size:clamp(34px,6vw,52px);font-weight:900;letter-spacing:-0.035em;line-height:0.95">IEG<span style="color:var(--red)"> NEWS</span></h1>
        <p style="margin:0 0 4px;font-size:11px;font-weight:800;letter-spacing:0.16em;color:rgba(51,51,51,0.45)">주식회사 아이지 · TECH-EDU</p>
      </div>
      <div style="border-top:3px solid var(--ink)"></div>
      <div style="border-top:1px solid var(--ink);margin-top:4px"></div>
      <nav style="padding:clamp(14px,2vw,18px) 0;border-bottom:1px solid rgba(51,51,51,0.2)">
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;max-width:340px">
        <sc-if value="{{ isNewsletter }}" hint-placeholder-val="{{ true }}">
          <span style="box-sizing:border-box;display:flex;align-items:center;justify-content:center;width:100%;height:44px;border:1px solid #333333;background:#333333;color:#FFFFFF;font-size:15px;font-weight:800;letter-spacing:0.01em">소식지</span>

        <sc-if value="{{ !isNewsletter }}" hint-placeholder-val="{{ false }}">
          <button onClick="{{ showNewsletter }}" style="box-sizing:border-box;display:flex;align-items:center;justify-content:center;width:100%;height:44px;padding:0;appearance:none;border:1px solid rgba(51,51,51,0.28);background:transparent;font-size:15px;font-weight:700;letter-spacing:0.01em;color:rgba(51,51,51,0.6);cursor:pointer;transition:color .15s,border-color .15s" style-hover="color:#333333;border-color:#333333">소식지</button>
        </sc-if>

        <sc-if value="{{ isPress }}" hint-placeholder-val="{{ false }}">
          <span style="box-sizing:border-box;display:flex;align-items:center;justify-content:center;width:100%;height:44px;border:1px solid #333333;background:#333333;color:#FFFFFF;font-size:15px;font-weight:800;letter-spacing:0.01em">언론 보도</span>
        </sc-if>
        <sc-if value="{{ !isPress }}" hint-placeholder-val="{{ true }}">
          <button onClick="{{ showPress }}" style="box-sizing:border-box;display:flex;align-items:center;justify-content:center;width:100%;height:44px;padding:0;appearance:none;border:1px solid rgba(51,51,51,0.28);background:transparent;font-size:15px;font-weight:700;letter-spacing:0.01em;color:rgba(51,51,51,0.6);cursor:pointer;transition:color .15s,border-color .15s" style-hover="color:#333333;border-color:#333333">언론 보도</button>
        </sc-if>
      </div>
      </nav>
    </header>

    <sc-if value="{{ isNewsletter }}" hint-placeholder-val="{{ true }}">
    <section style="padding:clamp(30px,4vw,48px) 0 clamp(36px,4.5vw,60px)">
      <!-- 호(월)마다 카드 하나. 최신 호가 앞으로 온다. -->
      <div class="ieg-issues">
        <sc-for list="{{ issues }}" as="g" hint-placeholder-count="2">
          <article class="ieg-card">
            <!-- 미리보기는 호마다 크기가 같고, 여러 면이면 커서를 올렸을 때 부챗살로 펼쳐진다. -->
            <button class="{{ g.fanClass }}" onClick="{{ g.open }}" aria-label="{{ g.alt }}">
              <sc-for list="{{ g.previews }}" as="p" hint-placeholder-count="2">
                <img class="ieg-pg" src="{{ p.src }}" alt="" loading="lazy">
              </sc-for>
            </button>

            <div style="display:flex;flex-direction:column;gap:7px">
              <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px">
                <span style="display:inline-block;padding:4px 9px;background:var(--red);color:#FFFFFF;font-size:11px;font-weight:800;letter-spacing:0.06em">{{ g.issue }}</span>
                <span style="font-size:11px;font-weight:800;letter-spacing:0.1em;color:var(--muted)">{{ g.count }}</span>
              </div>
              <sc-if value="{{ showCaptions }}" hint-placeholder-val="{{ true }}">
                <p style="margin:0;font-size:13px;font-weight:700;line-height:1.55;letter-spacing:-0.01em;color:rgba(51,51,51,0.75)">{{ g.caption }}</p>
              </sc-if>
            </div>
          </article>
        </sc-for>
      </div>
    </section>
    </sc-if>

    <sc-if value="{{ isPress }}" hint-placeholder-val="{{ false }}">
    <section style="padding:clamp(24px,3vw,36px) 0 0">

      <p style="margin:0 0 clamp(14px,2vw,20px);font-size:13px;font-weight:600;line-height:1.6;color:rgba(51,51,51,0.5)">같은 내용이 여러 매체에 보도된 경우, 가장 상위 언론사의 기사만 싣습니다.</p>

      <sc-for list="{{ items }}" as="item" hint-placeholder-count="12">
        <div class="ieg-row">
          <sc-if value="{{ item.img }}" hint-placeholder-val="{{ true }}">
            <a class="ieg-thumb" href="{{ item.url }}" target="_blank" rel="noopener" tabIndex="-1" aria-hidden="true" style="width:clamp(88px,11vw,132px);height:clamp(62px,7.6vw,92px)">
              <img src="{{ item.img }}" alt="" loading="lazy" referrerPolicy="no-referrer">

          </sc-if>

              <span style="font-size:12px;font-weight:800;letter-spacing:0.06em;color:var(--red)">{{ item.media }}</span>
              <sc-if value="{{ item.note }}" hint-placeholder-val="{{ false }}">

              </sc-if>
            </div>
            <a href="{{ item.url }}" target="_blank" rel="noopener" style="font-size:clamp(16px,1.9vw,19px);font-weight:700;line-height:1.45;letter-spacing:-0.015em;text-wrap:pretty;transition:color .15s">{{ item.title }}</a>

        </div>
      </sc-for>

        </sc-if>
        <sc-for list="{{ pages }}" as="p" hint-placeholder-count="5">
          <sc-if value="{{ p.active }}" hint-placeholder-val="{{ false }}">
            <span style="display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:36px;padding:0 10px;background:#333333;color:#FFFFFF;font-size:15px;font-weight:800">{{ p.label }}</span>

            <button onClick="{{ p.select }}" style="appearance:none;border:1px solid rgba(51,51,51,0.2);background:transparent;min-width:36px;height:36px;padding:0 10px;font-size:15px;font-weight:700;color:rgba(51,51,51,0.7);cursor:pointer;transition:color .15s,border-color .15s" style-hover="color:#FF0000;border-color:#FF0000">{{ p.label }}</button>
          </sc-if>
        </sc-for>
        <sc-if value="{{ hasNext }}" hint-placeholder-val="{{ true }}">
          <button onClick="{{ goNext }}" style="appearance:none;border:1px solid rgba(51,51,51,0.2);background:transparent;min-width:36px;height:36px;padding:0 10px;font-size:15px;font-weight:800;color:rgba(51,51,51,0.7);cursor:pointer;transition:color .15s,border-color .15s" style-hover="color:#FF0000;border-color:#FF0000">›</button>

      </nav>

    </section>

      </div>
    </footer>
  </div>
</div>

    <button onClick="{{ nextPage }}" style="position:absolute;right:clamp(10px,2vw,26px);top:50%;transform:translateY(-50%);width:48px;height:64px;border:none;background:rgba(255,255,255,0.14);color:#FFFFFF;font-size:20px;font-weight:800;cursor:pointer;transition:background .15s" style-hover="background:#FF0000">›</button>

  </div>
</sc-if>

// 소식지. 호(월)마다 블록 하나이고, 최신 호가 배열 앞(위)으로 온다.
// 한 호 안에서는 면 순서대로 두고, 한 번에 한 면씩 보여주며 화살표로 넘긴다.
const ISSUES = [
  { issue: '2026. 09', pages: [
    { src: 'uploads/3.png', cap: 'PAGE 01 · 특수분야 연수기관 지정 / IEGLAB.COM 공식 오픈' }
  ] },
  { issue: '2026. 08', pages: [
    { src: 'uploads/1.png', cap: 'PAGE 01 · 포브스 코리아 에듀테크 30 / KBS 추적 60분' },
    { src: 'uploads/2.png', cap: 'PAGE 02 · 성남시청 연계 견학 / 전남광주미래산업박람회' }
  ] }
];

// 확대 보기는 호 구분 없이 전체 면을 차례로 넘긴다.
const FLAT = [];
ISSUES.forEach((g, gi) => g.pages.forEach((p, pi) => {
  FLAT.push({ src: p.src, cap: p.cap, issue: g.issue, gi: gi, pi: pi });
}));

const pad2 = (n) => (n < 10 ? '0' + n : String(n));

const PER_PAGE = 10;

const rankOf = (media) => { const i = RANK.indexOf(media); return i === -1 ? RANK.length : i; };

// 발행일 내림차순(최신이 위). 같은 날짜면 RANK 순(메이저 언론사 우선).
// d는 'YYYY-MM-DD'가 기본이고, 일/월이 확인되지 않으면 'YYYY-MM' 또는 'YYYY'로 적는다.
// 짧은 값은 긴 값의 접두사라 내림차순에서 해당 기간 맨 뒤로 간다.
const SORTED = [...ARTICLES].sort((a, b) =>
  a.d === b.d ? rankOf(a.m) - rankOf(b.m) : (a.d < b.d ? 1 : -1)
);

// '2026-09-07' -> '2026. 09. 07' / '2024-05' -> '2024. 05' / '2017' -> '2017'
const dateLabel = (d) => d.split('-').join('. ');
const PAGE_COUNT = Math.max(1, Math.ceil(SORTED.length / PER_PAGE));

class Component extends DCLogic {
  state = {
    tab: 'newsletter', page: 1, modalIndex: null, progress: 0, showTop: false
  };

  componentDidMount() {
    this._onKey = (e) => {
      if (this.state.modalIndex !== null) {
        if (e.key === 'Escape') this.closeModal();
        if (e.key === 'ArrowRight') this.step(1);
        if (e.key === 'ArrowLeft') this.step(-1);
      }
    };
    this._onScroll = () => {
      const h = document.documentElement;
      const max = h.scrollHeight - h.clientHeight;
      const y = h.scrollTop || document.body.scrollTop;
      this.setState({ progress: max > 0 ? Math.min(100, (y / max) * 100) : 0, showTop: y > 380 });
    };
    window.addEventListener('keydown', this._onKey);
    window.addEventListener('scroll', this._onScroll, { passive: true });
  }

  componentWillUnmount() {
    window.removeEventListener('keydown', this._onKey);
    window.removeEventListener('scroll', this._onScroll);
  }

  closeModal() {
    this.setState({ modalIndex: null });
  }

  step(dir) {
    this.setState(s => ({ modalIndex: (s.modalIndex + dir + FLAT.length) % FLAT.length }));
  }

  renderVals() {
    const s = this.state;

    const page = Math.min(Math.max(1, s.page), PAGE_COUNT);
    const start = (page - 1) * PER_PAGE;
    const slice = SORTED.slice(start, start + PER_PAGE);

    // 페이지를 바꾸면 목록 위쪽이 보이도록 맨 위로 올린다.
    const goTo = (n) => {
      this.setState({ page: n });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    const pages = Array.from({ length: PAGE_COUNT }, (_, i) => ({
      label: String(i + 1),
      active: i + 1 === page,
      select: () => goTo(i + 1)
    }));

    const issues = ISSUES.map((g, gi) => {
      const n = g.pages.length;
      return {
        issue: g.issue,
        // 펼쳐지는 건 앞 4장까지. 그 이상은 어차피 겹쳐 보이지 않는다.
        previews: g.pages.slice(0, 4).map(p => ({ src: p.src })),
        fanClass: n > 1 ? 'ieg-fan' : 'ieg-fan is-single',
        count: n > 1 ? pad2(n) + '면' : '1면',
        caption: g.pages[0].cap,
        alt: 'IEG 소식지 ' + g.issue + ' 펼쳐 보기',
        open: () => this.setState({ modalIndex: FLAT.findIndex(f => f.gi === gi) })
      };
    });

    return {
      issues,
      items: slice.map(a => ({
        date: dateLabel(a.d), media: a.m, title: a.t, url: a.u,
        note: a.note || '', img: a.img || ''
      })),
      pages,
      hasPrev: page > 1,
      hasNext: page < PAGE_COUNT,
      goPrev: () => goTo(page - 1),
      goNext: () => goTo(page + 1),
      isNewsletter: s.tab === 'newsletter',
      isPress: s.tab === 'press',
      showNewsletter: () => this.setState({ tab: 'newsletter' }),
      showPress: () => this.setState({ tab: 'press' }),
      showCaptions: this.props.showNewsletterCaptions ?? true,
      progress: s.progress,
      showTop: s.showTop,
      scrollTop: () => window.scrollTo({ top: 0, behavior: 'smooth' }),
      modalOpen: s.modalIndex !== null,
      pageLabel: s.modalIndex !== null
        ? FLAT[s.modalIndex].issue + ' · PAGE ' + pad2(FLAT[s.modalIndex].pi + 1)
        : '',
      modalImage: s.modalIndex !== null
        ? React.createElement('img', {
            src: FLAT[s.modalIndex].src,
            alt: 'IEG 소식지 ' + FLAT[s.modalIndex].issue + ' 확대 보기',
            style: { maxWidth: 'min(920px,88vw)', maxHeight: '88vh', width: 'auto', height: 'auto', objectFit: 'contain', background: '#FFFDF8', boxShadow: '0 24px 60px rgba(0,0,0,0.45)' }
          })
        : null,
      prevPage: (e) => { e.stopPropagation(); this.step(-1); },
      nextPage: (e) => { e.stopPropagation(); this.step(1); },
      // 확대 보기에서 넘긴 면을 닫은 뒤에도 그대로 보여준다.
      closeModal: () => this.closeModal()
    };
  }
}
</script>
</body>
</html>
