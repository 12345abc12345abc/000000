<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IEG NEWS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  html, body { margin: 0; padding: 0; background: #FAF7F0; scroll-behavior: smooth; }
  body { font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; -webkit-font-smoothing: antialiased; color: #333333; }
  * { font-family: inherit; }
  a { color: #333333; text-decoration: none; }
  a:hover { color: #FF0000; }
  ::selection { background: #FFB300; color: #333333; }
  @keyframes iegIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
</style>
</helmet>
<div style="min-height:100vh;background:#FAF7F0;padding:0 clamp(20px,5vw,64px) 0">
  <div style="position:fixed;top:0;left:0;right:0;height:3px;background:rgba(51,51,51,0.08);z-index:40">
    <div style="height:100%;background:#FF0000;width:{{ progress }}%"></div>
  </div>
  <div style="max-width:1160px;margin:0 auto">

    <header style="padding:clamp(28px,4vw,48px) 0 0">
      <div style="border-top:7px solid #333333"></div>
      <div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding:clamp(20px,3vw,32px) 0 clamp(16px,2.4vw,24px)">
        <h1 style="margin:0;font-size:68px;font-weight:900;letter-spacing:-0.03em;line-height:1">IEG<span style="color:#FF0000"> NEWS</span></h1>
        <p style="margin:0;font-size:13px;font-weight:600;letter-spacing:0.12em;color:rgba(51,51,51,0.6)">아이지 소식지 · 언론 보도 아카이브</p>
      </div>
      <div style="border-top:3px solid #333333"></div>
      <div style="border-top:1px solid #333333;margin-top:4px"></div>
      <nav style="display:flex;gap:clamp(20px,3vw,36px);border-bottom:1px solid rgba(51,51,51,0.2)">
        <button onClick="{{ showNewsletter }}" style="position:relative;appearance:none;border:none;background:transparent;padding:16px 2px;font-size:16px;font-weight:800;letter-spacing:-0.01em;color:#333333;cursor:pointer;transition:color .15s" style-hover="color:#FF0000">
          소식지
          <sc-if value="{{ isNewsletter }}" hint-placeholder-val="{{ true }}">
            <span style="position:absolute;left:0;right:0;bottom:-1px;height:3px;background:#FF0000"></span>
          </sc-if>
        </button>
        <button onClick="{{ showPress }}" style="position:relative;appearance:none;border:none;background:transparent;padding:16px 2px;font-size:16px;font-weight:800;letter-spacing:-0.01em;color:#333333;cursor:pointer;transition:color .15s" style-hover="color:#FF0000">
          언론 보도
          <sc-if value="{{ isPress }}" hint-placeholder-val="{{ false }}">
            <span style="position:absolute;left:0;right:0;bottom:-1px;height:3px;background:#FF0000"></span>
          </sc-if>
        </button>
      </nav>
    </header>

    <sc-if value="{{ isNewsletter }}" hint-placeholder-val="{{ true }}">
    <section style="padding:clamp(40px,5vw,64px) 0 clamp(32px,4vw,52px)">
      <span style="display:inline-block;margin:0 0 clamp(14px,2vw,20px);padding:5px 10px;background:#FF0000;color:#FFFFFF;font-size:12px;font-weight:800;letter-spacing:0.04em">2026. 08</span>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(20px,3vw,36px)">
        <figure style="margin:0;display:flex;flex-direction:column;gap:12px">
          <div onClick="{{ openPage1 }}" style="overflow:hidden;cursor:zoom-in;background:#FFFDF8;border:1px solid rgba(51,51,51,0.18);transition:border-color .15s,box-shadow .2s,transform .2s" style-hover="border-color:#FF0000;box-shadow:0 14px 34px rgba(51,51,51,0.16);transform:translateY(-3px)">
            <img src="uploads/1.png" alt="IEG 소식지 1면" style="display:block;width:100%;height:auto">
          </div>
          <sc-if value="{{ showCaptions }}" hint-placeholder-val="{{ true }}">
            <figcaption style="font-size:12px;font-weight:700;letter-spacing:0.08em;color:rgba(51,51,51,0.55)">PAGE 01 · 포브스 코리아 에듀테크 30 / KBS 추적 60분</figcaption>
          </sc-if>
        </figure>
        <figure style="margin:0;display:flex;flex-direction:column;gap:12px">
          <div onClick="{{ openPage2 }}" style="overflow:hidden;cursor:zoom-in;background:#FFFDF8;border:1px solid rgba(51,51,51,0.18);transition:border-color .15s,box-shadow .2s,transform .2s" style-hover="border-color:#FF0000;box-shadow:0 14px 34px rgba(51,51,51,0.16);transform:translateY(-3px)">
            <img src="uploads/2.png" alt="IEG 소식지 2면" style="display:block;width:100%;height:auto">
          </div>
          <sc-if value="{{ showCaptions }}" hint-placeholder-val="{{ true }}">
            <figcaption style="font-size:12px;font-weight:700;letter-spacing:0.08em;color:rgba(51,51,51,0.55)">PAGE 02 · 성남시청 연계 견학 / 전남광주미래산업박람회</figcaption>
          </sc-if>
        </figure>
      </div>
    </section>
    </sc-if>

    <sc-if value="{{ isPress }}" hint-placeholder-val="{{ false }}">
    <section style="padding:clamp(24px,3vw,36px) 0 0">
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
        <div style="padding-top:clamp(26px,3.4vw,40px)">
          <div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:2px">
            <span style="display:inline-block;padding:5px 10px;background:#FF0000;color:#FFFFFF;font-size:12px;font-weight:800;letter-spacing:0.04em">{{ g.label }}</span>
            <span style="font-size:13px;font-weight:600;color:rgba(51,51,51,0.5)">{{ g.sub }}</span>
          </div>
          <div style="display:grid;gap:0 clamp(28px,4vw,56px);grid-template-columns:repeat(auto-fill,minmax(330px,1fr))">
            <sc-for list="{{ g.items }}" as="item" hint-placeholder-count="5">
              <div style="display:flex;flex-direction:column;gap:9px;padding:20px 0;border-top:1px solid rgba(51,51,51,0.2);transition:border-color .15s" style-hover="border-top-color:#FF0000">
                <span style="font-size:12px;font-weight:800;letter-spacing:0.06em;color:#FF0000">{{ item.media }}</span>
                <a href="{{ item.url }}" target="_blank" rel="noopener" style="font-size:18px;font-weight:700;line-height:1.5;text-wrap:pretty;transition:color .15s">{{ item.title }}</a>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </section>
    </sc-if>

    <footer style="margin-top:clamp(56px,7vw,96px);padding-bottom:clamp(40px,5vw,64px)">
      <div style="border-top:3px solid #333333"></div>
      <div style="border-top:1px solid #333333;margin-top:4px"></div>
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding-top:18px;font-size:12px;font-weight:800;letter-spacing:0.14em;color:rgba(51,51,51,0.7)">
        <span>IEG NEWS</span>
        <span>주식회사 아이지 · TECH-EDU</span>
      </div>
    </footer>
  </div>
</div>

<sc-if value="{{ showTop }}" hint-placeholder-val="{{ false }}">
  <button onClick="{{ scrollTop }}" style="position:fixed;right:clamp(16px,3vw,32px);bottom:clamp(16px,3vw,32px);z-index:30;width:52px;height:52px;border:none;background:#333333;color:#FFFFFF;font-size:16px;font-weight:800;cursor:pointer;animation:iegIn .2s ease-out;transition:background .15s" style-hover="background:#FF0000">↑</button>
</sc-if>

<sc-if value="{{ modalOpen }}" hint-placeholder-val="{{ false }}">
  <div onClick="{{ closeModal }}" style="position:fixed;inset:0;z-index:50;background:rgba(24,22,18,0.92);display:flex;align-items:center;justify-content:center;padding:clamp(16px,4vw,48px);cursor:zoom-out;animation:iegIn .18s ease-out">
    {{ modalImage }}
    <button onClick="{{ prevPage }}" style="position:absolute;left:clamp(10px,2vw,26px);top:50%;transform:translateY(-50%);width:48px;height:64px;border:none;background:rgba(255,255,255,0.14);color:#FFFFFF;font-size:20px;font-weight:800;cursor:pointer;transition:background .15s" style-hover="background:#FF0000">‹</button>
    <button onClick="{{ nextPage }}" style="position:absolute;right:clamp(10px,2vw,26px);top:50%;transform:translateY(-50%);width:48px;height:64px;border:none;background:rgba(255,255,255,0.14);color:#FFFFFF;font-size:20px;font-weight:800;cursor:pointer;transition:background .15s" style-hover="background:#FF0000">›</button>
    <div style="position:absolute;bottom:clamp(12px,2.5vw,28px);left:50%;transform:translateX(-50%);font-size:12px;font-weight:800;letter-spacing:0.12em;color:rgba(255,255,255,0.75)">{{ pageLabel }}</div>
    <button onClick="{{ closeModal }}" style="position:absolute;top:clamp(12px,2.5vw,28px);right:clamp(12px,2.5vw,28px);width:44px;height:44px;border:none;background:#FF0000;color:#FFFFFF;font-size:20px;font-weight:800;cursor:pointer;line-height:1">×</button>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showNewsletterCaptions&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
const RANK = ['매일경제','전자신문','연합뉴스','아시아경제','폴리뉴스','파이낸스투데이','데일리경제','내외경제TV','공감신문','ABC뉴스','피앤피뉴스'];

const ARTICLES = [
  { m:'폴리뉴스', month:'2026. 09', t:'아이지, 2026 전남광주미래산업박람회 참가…스마트공장 기술교육 솔루션 선보여', u:'https://www.polinews.co.kr/news/articleView.html?idxno=742219' },
  { m:'데일리경제', month:'2026. 09', t:'아이지, 2026 전남광주미래산업박람회서 스마트공장 기술교육 솔루션 공개', u:'https://www.kdpress.co.kr/news/articleView.html?idxno=208337' },
  { m:'내외경제TV', month:'2026. 09', t:'아이지, 주요 제조사 설비 호환 스마트 제조 실습 플랫폼 구축', u:'https://www.nbntv.co.kr/news/articleView.html?idxno=4024573' },
  { m:'공감신문', month:'2026. 09', t:'아이지, 2026 전남광주미래산업박람회서 스마트공장 기술교육 솔루션 선보여', u:'https://www.gokorea.kr/news/articleView.html?idxno=877254' },
  { m:'ABC뉴스', month:'2026. 09', t:'아이지, ‘전남광주미래산업박람회’서 스마트공장 교육 솔루션 공개', u:'https://www.abcn.kr/news/articleView.html?idxno=91344' },
  { m:'매일경제', month:'2026. 07', t:'아이지, 온·오프라인 기술교육 플랫폼 구축', u:'https://m.mk.co.kr/amp/12105344' },
  { m:'전자신문', month:'2026. 07', t:'아이지, 온라인-오프라인 통합 플랫폼 구축으로 기술교육 플랫폼 기업 도약', u:'https://n.news.naver.com/mnews/article/030/0003450763?sid=101' },
  { m:'연합뉴스', month:'2026. 07', t:'교육장비 넘어 플랫폼으로…아이지, 미래 기술교육 새판 짠다', u:'https://kgyonhapnews.net/256754' },
  { m:'아시아경제', month:'2026. 07', t:'아이지, 오픈랩·아이지랩닷컴 구축…온·오프라인 기술교육 강화', u:'https://view.asiae.co.kr/article/2026072313183421696' },
  { m:'폴리뉴스', month:'2026. 07', t:'㈜아이지, 온라인-오프라인 통합 기술교육 플랫폼 구축 “글로벌 테크에듀 생태계 조성 본격화”', u:'https://www.polinews.co.kr/news/articleView.html?idxno=737803' },
  { m:'파이낸스투데이', month:'2026. 07', t:'㈜아이지, 온라인-오프라인 통합 플랫폼 구축으로 기술교육 플랫폼 기업 도약', u:'https://www.fntoday.co.kr/news/articleView.html?idxno=388717' },
  { m:'데일리경제', month:'2026. 07', t:'㈜아이지, 온라인-오프라인 통합 기술교육 플랫폼 구축', u:'https://www.kdpress.co.kr/news/articleView.html?idxno=207199' },
  { m:'공감신문', month:'2026. 07', t:'아이지, 온·오프라인 통합 기술교육 플랫폼 구축', u:'https://www.gokorea.kr/news/articleView.html?idxno=872870' },
  { m:'피앤피뉴스', month:'2026. 07', t:'㈜아이지, 온라인-오프라인 통합 플랫폼 구축으로 기술교육 플랫폼 기업 도약', u:'https://www.gosiweek.com/article/1065585674324659' }
];

const MONTHS = ['2026. 09', '2026. 07'];
const MONTH_SUB = { '2026. 09': '2026 전남광주미래산업박람회', '2026. 07': 'OPEN LAB · IEGLAB.COM 통합 기술교육 플랫폼' };
const PAGES = ['uploads/1.png', 'uploads/2.png'];

class Component extends DCLogic {
  state = {
    tab: 'newsletter', modalIndex: null, progress: 0, showTop: false
  };

  componentDidMount() {
    this._onKey = (e) => {
      if (this.state.modalIndex !== null) {
        if (e.key === 'Escape') this.setState({ modalIndex: null });
        if (e.key === 'ArrowRight') this.step(1);
        if (e.key === 'ArrowLeft') this.step(-1);
      }
    };
    this._onScroll = () => {
      const h = document.documentElement;
      const max = h.scrollHeight - h.clientHeight;
      const y = h.scrollTop || document.body.scrollTop;
      this.setState({ progress: max > 0 ? Math.min(100, (y / max) * 100) : 0, showTop: y > 380 });
    };
    window.addEventListener('keydown', this._onKey);
    window.addEventListener('scroll', this._onScroll, { passive: true });
  }

  componentWillUnmount() {
    window.removeEventListener('keydown', this._onKey);
    window.removeEventListener('scroll', this._onScroll);
  }

  step(dir) {
    this.setState(s => ({ modalIndex: (s.modalIndex + dir + PAGES.length) % PAGES.length }));
  }

  renderVals() {
    const s = this.state;

    const groups = MONTHS.map(mo => ({
      label: mo,
      sub: MONTH_SUB[mo],
      items: ARTICLES.filter(a => a.month === mo)
        .sort((a, b) => RANK.indexOf(a.m) - RANK.indexOf(b.m))
        .map(a => ({ media: a.m, title: a.t, url: a.u }))
    })).filter(g => g.items.length > 0);

    return {
      isNewsletter: s.tab === 'newsletter',
      isPress: s.tab === 'press',
      showNewsletter: () => this.setState({ tab: 'newsletter' }),
      showPress: () => this.setState({ tab: 'press' }),
      showCaptions: this.props.showNewsletterCaptions ?? true,
      progress: s.progress,
      showTop: s.showTop,
      scrollTop: () => window.scrollTo({ top: 0, behavior: 'smooth' }),
      groups,
      modalOpen: s.modalIndex !== null,
      pageLabel: s.modalIndex !== null ? 'PAGE 0' + (s.modalIndex + 1) + ' / 0' + PAGES.length : '',
      modalImage: s.modalIndex !== null
        ? React.createElement('img', {
            src: PAGES[s.modalIndex],
            alt: 'IEG 소식지 확대 보기',
            style: { maxWidth: 'min(920px,88vw)', maxHeight: '88vh', width: 'auto', height: 'auto', objectFit: 'contain', background: '#FFFDF8', boxShadow: '0 24px 60px rgba(0,0,0,0.45)' }
          })
        : null,
      openPage1: () => this.setState({ modalIndex: 0 }),
      openPage2: () => this.setState({ modalIndex: 1 }),
      prevPage: (e) => { e.stopPropagation(); this.step(-1); },
      nextPage: (e) => { e.stopPropagation(); this.step(1); },
      closeModal: () => this.setState({ modalIndex: null })
    };
  }
}
</script>
</body>
</html>
